name: Keep Supabase Alive

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Query an article
        run: curl --fail --show-error --silent --location "${{ secrets.BACKEND_URL }}/api/articles?limit=1"
